name: Release

# Builds the signed release bundle (AAB) for Google Play when a tag v<versionName> is pushed, or by hand.
# The upload key lives only in GitHub secrets (AGENTS rule 10); Play App Signing holds the app signing key.
# Secrets: TARRY_UPLOAD_KEYSTORE_BASE64, TARRY_UPLOAD_STORE_PASSWORD, TARRY_UPLOAD_KEY_ALIAS, TARRY_UPLOAD_KEY_PASSWORD.
# The AAB is uploaded to Play Console by the owner (no Play API credentials in CI).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$name" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName $name" >&2
            exit 1
          fi
      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.TARRY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing secret TARRY_UPLOAD_KEYSTORE_BASE64" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "TARRY_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Tests, lint and the signed bundle
        env:
          TARRY_UPLOAD_STORE_PASSWORD: ${{ secrets.TARRY_UPLOAD_STORE_PASSWORD }}
          TARRY_UPLOAD_KEY_ALIAS: ${{ secrets.TARRY_UPLOAD_KEY_ALIAS }}
          TARRY_UPLOAD_KEY_PASSWORD: ${{ secrets.TARRY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest :segmentation:test lintDebug bundleRelease --stacktrace
      - name: Verify the bundle is signed
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | grep -q "jar verified" || { echo "Bundle is not signed" >&2; exit 1; }
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: tarry-release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
